name: Release CyberDot.Encoding.Base84

# Manually-triggered release for the Base84 package. See _release-package.yml for
# what this actually does.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (e.g. 1.2.0). Leave empty to use the version in the csproj.'
        required: false
        type: string

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/_release-package.yml
    with:
      project-path: src/CyberDot.Encoding.Base84/CyberDot.Encoding.Base84.csproj
      tag-prefix: base84
      version: ${{ inputs.version }}
